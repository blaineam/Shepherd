# Optional: run Shepherd as a supervised container. Docker is only the process
# supervisor here; the same static binary runs anywhere without it.
# Put the `shepherd` binary next to this file, then: docker compose up -d --build
services:
  shepherd:
    build: .
    image: shepherd:local
    container_name: shepherd
    network_mode: host            # DNS on the LAN address, same as the bare binary
    restart: unless-stopped
    cap_drop: [ALL]
    # NET_BIND_SERVICE: port 53. NET_RAW: the passive ARP monitor (read-only)
    # and Watch mode's raw frame sends. NET_ADMIN and BPF: Watch mode only —
    # NET_ADMIN loads the XDP relay onto the interface and toggles GRO for
    # the userspace relay, BPF loads the program itself (CAP_SYS_ADMIN
    # stands in for BPF on kernels before 5.8). Drop NET_ADMIN and BPF to
    # run DNS filtering and the ARP monitor without Watch mode: it then
    # reports itself unavailable in the portal and nothing else changes.
    # See docs/WATCH.md.
    cap_add: [NET_BIND_SERVICE, NET_RAW, NET_ADMIN, BPF]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./shepherd.toml:/etc/shepherd/shepherd.toml:ro
      - ./data:/data              # set data_dir = "/data" in shepherd.toml
