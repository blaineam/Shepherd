# Optional: run Shepherd as a supervised container. Docker is only the process
# supervisor here; the same static binary runs anywhere without it.
# Put the `shepherd` binary next to this file, then: docker compose up -d --build
services:
  shepherd:
    build: .
    image: shepherd:local
    container_name: shepherd
    network_mode: host            # DNS on the LAN address, same as the bare binary
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # to listen on port 53
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./shepherd.toml:/etc/shepherd/shepherd.toml:ro
      - ./data:/data              # set data_dir = "/data" in shepherd.toml
