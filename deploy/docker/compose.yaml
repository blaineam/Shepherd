# Optional: run Shepherd as a supervised container. Docker is only the process
# supervisor here; the same static binary runs anywhere without it.
# Put the `shepherd` binary next to this file, then: docker compose up -d --build
services:
  shepherd:
    build: .
    image: shepherd:local
    container_name: shepherd
    network_mode: host            # DNS on the LAN address, same as the bare binary
    restart: unless-stopped
    cap_drop: [ALL]
    # NET_BIND_SERVICE: port 53. NET_RAW: the passive ARP monitor (read-only)
    # and Watch mode's raw frame sends. The other three are Watch mode's
    # in-kernel XDP relay: NET_ADMIN attaches it to the interface and toggles
    # GRO for the userspace relay, BPF loads the program, and PERFMON is the
    # one that is easy to miss -- the kernel gates the pointer arithmetic the
    # program does on perfmon_capable(), so with BPF alone the verifier
    # refuses it outright ("pointer -= pointer prohibited") and Watch mode
    # falls back to the userspace relay. That fallback works, but it is the
    # difference between relaying inside the NIC driver and copying every
    # frame through userspace. CAP_SYS_ADMIN would cover it too and is far
    # broader. Drop NET_ADMIN, BPF and PERFMON to run DNS filtering and the
    # ARP monitor without Watch mode: it then reports itself unavailable in
    # the portal and nothing else changes. See docs/WATCH.md.
    cap_add: [NET_BIND_SERVICE, NET_RAW, NET_ADMIN, BPF, PERFMON]
    # DHCP mode (docs/DHCP.md) is off by default. When you turn it on, it also
    # needs these two kernel parameters, and it CANNOT set them here: this
    # container is read_only, so /proc/sys is not writable even with
    # NET_ADMIN. Shepherd reads them first and only writes what is already
    # wrong, so setting them here -- or on the host -- is enough, and it says
    # in the portal which one it could not get. send_redirects matters more
    # than it looks: on a one-armed gateway the kernel's default is to tell
    # each client "go direct to the router next time", which silently
    # un-routes it. Uncomment with DHCP mode, not before.
    # sysctls:
    #   net.ipv4.ip_forward: "1"
    #   net.ipv4.conf.all.send_redirects: "0"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./shepherd.toml:/etc/shepherd/shepherd.toml:ro
      - ./data:/data              # set data_dir = "/data" in shepherd.toml
