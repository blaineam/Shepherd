# Weekly: the blocklist URLs in the example config must still resolve. A 404 here
# once went unnoticed until it was tried on a real network.
name: Blocklist URLs
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-list-urls
