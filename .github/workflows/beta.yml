# Every push to main builds one rolling beta and deletes the previous betas, so
# the Releases page only ever shows the newest beta. Versions follow SemVer:
# the next planned release from VERSION plus -beta.<run number>.
#
# Not every push gets one: a beta must be NEWER than the newest stable release,
# or it is worse than no beta at all (SemVer puts X.Y.Z-beta.N before X.Y.Z, so
# everyone on the release would stop being offered updates). scripts/beta-guard
# decides, and docs/RELEASING.md says when it declines.
name: Beta
on:
  push:
    branches: [main]
concurrency:
  group: beta
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Is this commit one that should publish a beta?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest stable release by version, not by the date it was made.
          latest=$(gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == false) | .tagName' \
            | sed 's/^v//' | sort -V | tail -1)
          set +e
          scripts/beta-guard --latest-stable "$latest"
          rc=$?
          set -e
          case "$rc" in
            0)  echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            10) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *)  echo "beta-guard could not decide (exit $rc)"; exit 1 ;;
          esac
  beta:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Gate on tests, coverage and the leak guard
        run: |
          scripts/coverage
          scripts/leakcheck --all
      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: scripts/build-release "${{ steps.v.outputs.version }}"
      - name: Sign the checksums (docs/UPDATE.md)
        env:
          SHEPHERD_SIGNING_KEY: ${{ secrets.SHEPHERD_SIGNING_KEY }}
        run: scripts/sign-release
      - name: Publish this beta and prune the older ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          {
            echo "Automated beta of commit ${GITHUB_SHA::7}. Not for production use."
            echo
            echo "## Unreleased changes"
            scripts/release-notes Unreleased
          } > notes.md
          gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Beta ${{ steps.v.outputs.version }}" --notes-file notes.md
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -vx "$tag" \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
