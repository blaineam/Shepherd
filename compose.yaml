# Shepherd, Wave 1: DNS protection + uptime (Tailscale optional).
# Image tags are pinned by version for now; digest pinning and staged updates arrive in Wave 2.

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.57
    container_name: shepherd-adguard
    restart: unless-stopped
    network_mode: host # DNS on :53 of the LAN addresses, IPv4 and IPv6
    # Admin UI on :3002 (not :3000/:80, which NAS hosts commonly use).
    command:
      - --no-check-update
      - -c
      - /opt/adguardhome/conf/AdGuardHome.yaml
      - -w
      - /opt/adguardhome/work
      - --web-addr
      - 0.0.0.0:3002
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    healthcheck:
      # Query the LAN address, not loopback: NAS system DNS often owns 127.0.0.1:53
      # and would answer instead, hiding a dead AdGuard.
      test: ["CMD-SHELL", "nslookup -timeout=2 example.com ${HOST_IP:?set HOST_IP in .env} >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: shepherd-uptime
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data

  # Subnet router + exit node. Already running Tailscale in another container?
  # Migrate its state instead of starting a second node: docs/MIGRATING-TAILSCALE.md
  tailscale:
    image: tailscale/tailscale:v1.104.2
    container_name: shepherd-tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-} # only needed for a brand-new node; migrated state is already authenticated
      TS_HOSTNAME: ${TS_HOSTNAME:-shepherd}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ROUTES: ${LAN_ROUTES:-}
      TS_EXTRA_ARGS: --advertise-exit-node --reset
    volumes:
      - ./data/tailscale:/var/lib/tailscale
