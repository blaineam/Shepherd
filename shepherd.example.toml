# Copy to shepherd.toml (git-ignored) and edit. Never commit your real config.

# Protection is ON by default: a blocklist is active and Apple Private Relay is
# blocked. Opt out of anything below. Everything shown here is the default.

# Where Shepherd keeps its state (portal token, rules, cached lists).
# Keep this OUTSIDE the repository.
data_dir = "data"

# A brand new install starts with the catalog's recommended blocklists switched
# on (see docs/POLICY.md). Set true to start with none. Defining your own
# [[lists]] below does the same: they replace the recommended ones.
# This and [[lists]] are read ONCE, the first time Shepherd runs in a data
# directory (they also seed an install that predates policy.json). After that
# the portal owns the policy and these are ignored.
no_default_lists = false

[dns]
# host:port addresses, each served over UDP and TCP. Use your LAN address
# (not 0.0.0.0) on hosts where system DNS already holds 127.0.0.1:53. List
# one address per interface you want this reachable on — e.g. a wired LAN
# address, a separate Wi-Fi NIC's address, and a Tailscale address, all at
# once, if your host has more than one and you want every one of them
# answering queries.
listen = ["127.0.0.1:5353"]
# Also serve on 127.0.0.1 and [::1], on the port of the first address above.
# On by default, and worth leaving on if this host uses Shepherd as its own
# resolver: loopback is the one address that cannot disappear with an
# interface. On a real install a wired interface lost carrier, its LAN
# address went with it, and the host could no longer resolve anything --
# which also wedged sshd, since it blocks on reverse lookups, so the machine
# could not be reached to fix the interface. For this to help, put 127.0.0.1
# first in the host's own resolver (/etc/resolv.conf): a listener nothing
# asks is no use. An address already covered above is not added twice, and
# because Shepherd adds these itself rather than you asking for them, nothing
# that goes wrong with one stops it starting: system DNS commonly holds
# 127.0.0.1:53 already, and that is a logged warning. The addresses you do
# list are stricter. One this host does not have is a warning too, so losing
# an interface no longer stops Shepherd answering on the others -- but one
# another process is holding is still a startup failure, because then
# something else is answering DNS on it and starting anyway would hide that.
listen_loopback = true
# Upstream resolvers: "9.9.9.10", "9.9.9.10:5353", "tcp://ip", "tls://host[:853]" (DoT),
# "https://host/dns-query" (DoH). See docs/UPSTREAMS.md. This only seeds the list: once
# you change it in the portal, <data_dir>/upstreams.json wins.
upstreams = ["9.9.9.10", "149.112.112.10", "1.1.1.1"]
# Plain resolvers (IP addresses) used only to look up the names of tls:// and https://
# upstreams. Never the system resolver.
bootstrap = ["9.9.9.9", "1.1.1.1"]
block_mode = "null"            # "null" answers 0.0.0.0 / ::, "nxdomain" answers NXDOMAIN
# "auto" withholds AAAA answers only while outbound IPv6 is unreachable (a LAN with just private
# fd.. addresses); "on" always withholds them, "off" never does.
filter_aaaa = "auto"
probe_interval_seconds = 15
cache_size = 20000
log_size = 5000
# Extra apex domains no blocklist may ever contain (yours, plus the built-in set).
protected_domains = []

[privacy]
# Blocks Apple iCloud Private Relay (NXDOMAIN for its hostnames), as Apple
# documents for networks. Devices see a notice that the relay is unavailable
# here. Set false to allow it. After first run, change it from the portal.
block_private_relay = true

[history]
# What is remembered after the fact. "memory" (default) keeps recent queries in RAM
# only. "encrypted" keeps a searchable, AES-256-GCM encrypted record on disk: see
# docs/HISTORY.md for where the key lives and what it protects against.
mode = "memory"
retention_days = 30
max_mb = 2048
key_source = "file"    # "file" or "passphrase"
key_file = ""          # default <data_dir>/history/history.key

[map]
# The globe's location data: a free GeoIP database, downloaded once a month and
# used entirely on this machine.
enabled = true
# Work out "home" from the network's public address (a DNS "who am I" query to
# public resolvers). Choosing your own home in the portal always wins.
auto_home = true
# database_url = ""    # a mirror for offline or air-gapped installs

[devices]
# Names, vendors and groups for the machines on your network (docs/DEVICES.md).
# Every source is passive: Shepherd listens, it never scans or announces.
enabled = true
dns = true                       # learn a device from the address its DNS queries come from
neighbors = true                 # read the OS neighbor (ARP/NDP) table
neighbor_interval_seconds = 30
mdns = true                      # listen for multicast DNS announcements
reverse_dns = true               # ask one resolver for the name of each new address
reverse_dns_server = ""          # "ip" or "ip:port"; empty uses the default gateway (Linux)
save_interval_seconds = 60       # the registry is kept in <data_dir>/devices.json
quarantine_new_devices = true    # a new device joins the reserved Quarantine group until you move it

[classify]
# Automatically guesses each device's type (phone, camera, TV, ...) from its DNS
# lookups, MAC vendor and, when [map] is enabled, the networks it talks to
# (docs/CLASSIFY.md). A type you set yourself is never overwritten by a guess.
enabled = true
interval_seconds = 300           # how often guesses are reconsidered

[arp]
# Passive ARP monitor (docs/ARP.md): a read-only listener that learns real MAC
# addresses for the device registry and raises events about the ARP layer
# itself (a new MAC, an IP moving to a different MAC, a changed gateway MAC).
# Needs CAP_NET_RAW and Linux; without either, Shepherd logs a warning and
# starts normally with ARP monitoring off.
enabled = true
interface = ""                   # empty auto-detects the default route's interface

[alarms]
# The alarm engine (docs/ALARMS.md): new device, upstream DNS down/recovered,
# list update rejected, and more. Always recorded in the portal when enabled.
enabled = true

[alarms.push]
# Web Push to every browser that subscribed on the Alarms screen's
# Notifications tab. A browser can only subscribe from the HTTPS portal
# ([tls]); the VAPID key pair is generated once under the data directory.
enabled = true
contact = ""               # email or https URL a push service may contact; empty picks one

[alarms.ntfy]
# ntfy delivery is set up in the portal: Alarms -> Notifications -> Set up
# ntfy (docs/ALARMS.md). The server, topic and token live in
# <data_dir>/secrets.json (0600), like the mail relay and the router
# connections, and changing them needs no restart.
#
# This section is read ONCE, for an install that predates that: it is
# imported the first time Shepherd starts without a server in the portal,
# and ignored from then on (a startup line says so if it differs).
enabled = false
server = ""                # e.g. "https://ntfy.example.com" (self-hosted or public)
topic = "shepherd-alarms"
token = ""                 # bearer token, or leave empty and use username/password
username = ""
password = ""

[retention]
# One budget for everything in data_dir (docs/UPDATE.md "Retention"). 0 leaves each
# store to its own cap: history.max_mb, and 8 MiB each for bandwidth and network
# health history. A value is split between them and the Overview shows use against it.
max_mb = 0

[update]
# Self-update (docs/UPDATE.md): one request a day to GitHub's releases, an
# alarm when a newer Shepherd exists, and "Update now" on the Overview screen
# when this install can be replaced in place (not from a read-only container).
enabled = true
channel = "stable"         # or "beta" to follow the rolling beta
check_hours = 24

[threats]
# Threat feeds (docs/THREATS.md): four curated lists of malware hosts, botnet
# controllers and hijacked networks (abuse.ch and Spamhaus), matched against
# every lookup's name and answer and raised as threat-match alarms naming the
# device. A few hundred kilobytes each, refreshed on the interval.
enabled = true
interval_hours = 6

[accountability]
# Accountability-partner email alerts (docs/ACCOUNTABILITY.md): email a
# trusted contact when a device in a group or scope they chose accesses a
# category they chose, whether or not it was blocked. Enabled by default is
# safe: the library starts with no contacts and no subscriptions, and there
# is no mail relay, so a fresh install sends no mail until you add a
# subscription AND set up a relay — all three from the portal's
# Accountability screen, no restart needed.
enabled = true

[accountability.smtp]
# Optional, and read ONCE: the mail relay is set up in the portal's
# Accountability screen and kept in <data_dir>/secrets.json (0600). A relay
# set here (host non-empty) is imported the first time Shepherd starts
# without one in the portal, password included, and this section is ignored
# from then on (a startup line says so if it differs). Useful for automated
# provisioning, or to keep an existing setup working across the upgrade.
host = ""               # e.g. "smtp.example.com"
port = 587
username = ""
# Set the password directly or point password_file at a 0600 file holding
# just the password, never both. See docs/ACCOUNTABILITY.md.
password = ""
password_file = ""      # e.g. "/etc/shepherd/accountability-smtp-password"
from = ""               # e.g. "shepherd@example.com"
tls = "starttls"        # "starttls" (port 587 convention), "tls" (port 465) or "none"

[portscan]
# Scans every known device for open TCP ports on a short, common-port list,
# so you can see exposure you did not expect (docs/PORTSCAN.md). Unlike the
# passive sources above, this one actively opens connections to your own
# devices; it is kept deliberately gentle (plain connect scans, a short port
# list, bounded concurrency).
enabled = true
interval_seconds = 21600         # 6 hours; the port list itself is built in

[portscan.wan_exposure]
# For every port found open above, a best-effort read of whether the router
# also forwards it from the internet, via the router's own UPnP IGD
# port-mapping table (docs/PORTSCAN.md's "WAN exposure" section). Not every
# router cooperates (UPnP IGD disabled, or not implemented the same way by
# some consumer mesh systems); when it does not, exposure just reads
# "unknown" — never guessed safe or unsafe. Needs [portscan] enabled.
enabled = true
refresh_interval_seconds = 600   # 10 minutes; the router's NAT table is cached in between

[vulnscan]
# Deepens portscan's open-port findings into named, concrete vulnerability
# findings: a gentle banner/protocol probe per open port, matched against the
# built-in signature table plus Shepherd's own signature feed, rebuilt daily
# from the NVD and CISA's Known Exploited Vulnerabilities catalog
# (docs/VULNSCAN.md). Needs [portscan] enabled; it probes ports portscan
# already found open, it never scans for open ports itself.
enabled = true
interval_seconds = 86400        # once a day
# The feed is plain declarative data (products and version ranges), never
# code. A new feed re-scans right away. Set feed_url = "" to use only the
# built-in table and make no request at all; a file:// URL pins a local copy.
feed_url = "https://raw.githubusercontent.com/blaineam/shepherd/main/feeds/vulnscan.json"
feed_refresh_seconds = 21600    # 6 hours; an unchanged feed costs one conditional request

[nethealth]
# Latency, jitter, packet loss and reachability, probed every couple of
# minutes against the configured DNS upstreams plus a couple of well-known
# public resolvers, kept over months with hourly/daily rollup so trends are
# visible, not just this instant (docs/NETHEALTH.md). Off by default:
# unlike portscan/vulnscan (which only ever contact devices already on
# your own LAN), this probes fixed public internet addresses every cycle,
# which deserved its own default-off decision rather than inheriting
# portscan/vulnscan's default-on one (see docs/NETHEALTH.md for why).
# bufferbloat_enabled is a separate, far less frequent check that
# generates real load against your own uplink; also off by default.
enabled = false
interval_seconds = 120                 # 2 minutes; minimum 60
bufferbloat_enabled = false
bufferbloat_interval_seconds = 3600    # 1 hour; minimum 600 when enabled

[selftest]
# The built-in DNS self-test (docs/DNS-QA.md). Every interval it asks a
# known-good and a known-blocked name of EVERY address Shepherd listens on,
# over UDP and TCP, checks each upstream's error rate and latency, and warns
# when this host has a LAN address with no DNS listener. It only talks to
# Shepherd's own listeners. Results are on the Upstreams screen and
# /api/selftest; failures raise alarms (with a cooldown).
enabled = true
interval_seconds = 60                 # minimum 10
good_name = "example.com"             # must resolve
blocked_name = ""                     # a name on one of your lists; empty = a synthetic name Shepherd always blocks
not_served = []                       # LAN addresses of this host that deliberately have no DNS listener
max_error_percent = 5                 # flag an upstream above this error rate over the window
window_minutes = 15
alarm_cooldown_minutes = 30           # the least time between two alarms for the same finding

[portal]
listen = "127.0.0.1:8787"
idle_lock_minutes = 10           # relock to demo data after this long idle; 0 = never auto-lock
                                  # (the portal's own settings screen can override this at runtime)

[tls]
# A real certificate for the portal's own hostname, issued via ACME's
# DNS-01 challenge against Cloudflare DNS (docs/TLS.md). Off by default:
# both a real DNS hostname pointed at this machine and a scoped Cloudflare
# API token (DNS edit on the one zone, nothing broader; set it in the
# portal's Proxy tab, shared with [reverseproxy]) are needed before this
# does anything. Leaving it off (or enabled = false) changes nothing
# about the existing plain-HTTP portal.listen above; this only ever adds a
# second, HTTPS listener alongside it.
enabled = false
hostname = ""                   # e.g. "shepherd.example.com"
listen = ""                     # e.g. "0.0.0.0:8443"; separate from portal.listen
email = ""                      # optional; Let's Encrypt expiry-notice contact
# Optional, and read ONCE: the Cloudflare token is the one "DNS provider"
# token in the portal's Proxy tab, shared by [tls] and [reverseproxy] and
# kept in <data_dir>/secrets.json (0600). A token set here (directly, or in
# a 0600 file named by cloudflare_api_token_file; never both) is imported
# the first time Shepherd starts without one in the portal, and ignored from
# then on. If [tls] and [reverseproxy] name different tokens, [tls]'s wins.
cloudflare_api_token = ""
cloudflare_api_token_file = ""  # e.g. "/etc/shepherd/cloudflare-api-token"

[reverseproxy]
# Terminates HTTPS for your other self-hosted services and forwards each
# request, WebSockets included, to the backend you set for its hostname
# (docs/REVERSEPROXY.md). The hosts themselves are managed in the portal's
# Proxy tab, never here. One wildcard certificate for "*.<domain>" covers
# every proxied name, issued over the same Cloudflare DNS-01 flow as [tls].
# Off by default. Read the doc's "Before you point real traffic at this"
# section before moving port 443 over from another reverse proxy.
enabled = false
listen = ":8443"                # binding 443 is your call, not a default
redirect_listen = ""            # e.g. ":80" once your deployment can bind it; answers plain http:// with a 302 to https://
domain = ""                     # e.g. "example.com" -> certificate for *.example.com
email = ""                      # optional; Let's Encrypt expiry-notice contact
# Same read-once seed as [tls]'s, for the same single shared token: set it in
# the portal's Proxy tab instead. Never both fields.
cloudflare_api_token = ""
cloudflare_api_token_file = ""  # e.g. "/etc/shepherd/cloudflare-api-token"

[watch]
# DEPRECATED. For per-device bandwidth, connect your router instead: open the
# Bandwidth screen, "Read from your router", and sign in to eero or a UniFi
# controller (docs/TRAFFIC.md). That reads what the router already counts, so
# it measures BOTH directions, puts nothing in the path of your traffic, and
# works on networks where steering cannot be made reliable at all. Watch mode
# is kept for installs already using it and gets no new features.
#
# Watch mode (docs/WATCH.md): steers each eligible device's outbound IPv4
# traffic through Shepherd by one-sided ARP steering, relayed to the real
# gateway in the kernel (XDP) or by a parallel userspace relay. Off by default;
# needs Linux with CAP_NET_RAW, CAP_NET_ADMIN and CAP_BPF, and reports itself
# unavailable (DNS filtering unaffected) anywhere it cannot run. Never steered:
# the gateway, Shepherd's own interfaces, Excluded devices, network
# infrastructure (routers, mesh nodes, access points, hubs, Thread border
# routers, Thread/Matter advertisers), and any device whose own Watch switch
# is off in the portal. The Bandwidth screen's Watch mode section has the kill
# switch, which stops all steering at once and stays off across restarts until
# re-armed. One-sided means outbound-only visibility: downloads are estimated
# from each device's own TCP acknowledgements, never measured. IPv4 only.
#
# Known to fail on some networks: a mesh gateway that reflects forwarded frames
# back at Shepherd stops the first full-size segment of every flow, which looks
# like requests that hang. Source NAT fixed it when measured here, which is why
# any revival of this should be a DHCP/gateway mode (docs/GATEWAY.md) rather
# than one-sided steering.
enabled = false
interface = ""           # empty: the default route's interface
mode = "auto"            # auto (XDP native, else XDP generic, else userspace), xdp, userspace, off
workers = 0              # userspace relay workers; 0 = automatic (4)
# IPv6 steering (docs/IPV6-WATCH.md), by unicast Neighbor Advertisements.
# Off by default. Even when on it engages only where the network has a
# global IPv6 route to steer to; with unique-local addresses only (the
# common case) there is no off-link IPv6 traffic to steer and it idles,
# saying so in the portal. Smart-home hubs, Thread border routers and
# Matter devices are never IPv6-steered, whatever their own Watch switch
# says. Shepherd never sends Router Advertisements under any setting.
ipv6 = false
steer_infrastructure = false
active_window_seconds = 900   # steer only devices seen within the last 15 minutes
# Health knobs (seconds); 0 keeps the engine's defaults (3 / 15 / 30).
health_interval_seconds = 0
idle_grace_seconds = 0
startup_grace_seconds = 0

# The list a pre-policy install used, and the default for a new one. Defining
# any [[lists]] replaces the recommended catalog lists on a new install.
[[lists]]
name = "hagezi-pro"
url = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt"

[dhcp]
# DHCP mode (docs/DHCP.md). ALPHA, OFF BY DEFAULT, and the one setting in
# Shepherd that can take a household off the internet.
#
# Alpha means something specific here, so it is worth saying rather than
# implying: no real device has ever taken an address from this. The lease
# exchange is tested end to end, but only over loopback sockets on high
# ports, so the real port 67, the broadcast a client needs before it has an
# address, and a household's traffic crossing one network card twice have all
# been reasoned about rather than measured. Turning it on is trying it out.
# Nothing offers it to you; you have to come here.
#
# If you do want to try it, read docs/DHCP.md first and work through the
# staged rollout from the top. It starts at mode = "observe", which opens a
# listener with no way to send, so it cannot answer anything and is safe to
# leave running on a live network for as long as you like.
#
# What it is: Shepherd serves the LAN's DHCP, and for the devices it routes it
# hands out its own address as their gateway instead of the router's, then
# forwards and masquerades their traffic to the router. Both directions of
# those devices' traffic then pass through Shepherd, which is the only way to
# measure downloads rather than estimate them. One NIC, one flat segment, the
# router still routing: source NAT is what makes the hairpin work.
#
# mode has three positions, not two:
#   "off"     opens no socket; nothing changes (the default)
#   "observe" a listener with NO send path. It feeds the device registry from
#             every DHCP packet on the segment and shows what Shepherd would
#             have answered, without being able to answer. Safe to leave
#             running on a live network, and the right way to prove the
#             decoder against every device in the house before cutover.
#   "serve"   answers. It refuses to while another DHCP server is still
#             replying on the segment, and needs the typed confirmation in
#             the portal, so turning the router's DHCP off can be done after
#             this is set rather than under time pressure.
mode = "off"
interface = ""           # empty: the default route's interface
subnet = ""              # empty: taken from the interface, e.g. "192.0.2.0/24"
server_ip = ""           # empty: the interface's first IPv4 address
gateway = ""             # empty: the default route's gateway
# The dynamic range. Reserved addresses must lie OUTSIDE it, and so must
# server_ip and gateway; Shepherd refuses to serve otherwise, because handing
# one address out twice is how a DHCP server breaks a network.
pool_start = ""          # e.g. "192.0.2.100"
pool_end = ""            # e.g. "192.0.2.200"
dns = []                 # empty: hand out server_ip, which is the point
domain = ""              # option 15, the client's search domain
# Short on purpose. The lease time is how fast a device stops being routed
# when Shepherd decides it should not be, and that is the whole fail-open
# mechanism: an unhealthy Shepherd hands out the router's address instead of
# its own and the house drifts back by itself within one renewal. The cost is
# that the segment starts failing sooner after the host goes down. Minimum 60.
lease_seconds = 600
# Routing is separate from serving. With mode = "serve" and route = false,
# every lease carries the router's own address, so nothing is on Shepherd's
# data path -- a complete, safe resting place to sit in for a week before
# routing anything. Turning it on routes every eligible device at its next
# renewal: there is no per-device opt-in, only the per-device opt-out in the
# portal and a refusal list that covers the gateway, Shepherd's own
# interfaces, network infrastructure, Thread and Matter gear, and consoles.
route = false
# Game consoles are left on the router by default: double NAT is what makes a
# console's NAT type worse, and it is noticed mid-match.
route_consoles = false
settle_seconds = 60     # quiet period with no other DHCP server before serving
nft = ""                # empty: "nft" on the PATH
